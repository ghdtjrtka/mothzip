name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # The audit scripts compare against independent codec implementations.
      - name: Install Python codec oracles
        run: python -m pip install --disable-pip-version-check zstandard lz4 brotli py7zr

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Release gate
        run: python audit/release_validation.py --binary target/release/mothzip.exe

      - name: Codec matrix
        run: python audit/codec_cli_validation.py --binary target/release/mothzip.exe

      - name: Edit CLI matrix
        run: python audit/edit_cli_validation.py --binary target/release/mothzip.exe

      - name: ZIP Zstd method
        run: python audit/zip_zstd_validation.py --binary target/release/mothzip.exe

      - name: Selection, SFX and split CLI matrices
        run: |
          python audit/selection_cli_validation.py --binary target/release/mothzip.exe
          python audit/sfx_validation.py --binary target/release/mothzip.exe
          python audit/split_cli_validation.py --binary target/release/mothzip.exe

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-runs
          path: audit/runs
          if-no-files-found: warn
