[package]
name = "mothzip"
version = "1.2.5"
edition = "2021"
rust-version = "1.93"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2", "aes-crypto", "zstd"] }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
thiserror = "1.0"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd", "deflate", "util"] }
rars = "0.12.2"
rfd = { version = "0.17.2", default-features = false }
zstd = { version = "0.14", default-features = false }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "encoder", "xz", "optimization"] }
lz4_flex = { version = "0.14.0", features = ["frame"] }
brotli = { version = "9.1.0", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
# A panic in this tool is a bug, not a recoverable state, and the unwinding tables cost about
# 1.7 MB of an 8 MB download. Nothing in the tree uses `catch_unwind`, so the release profile
# aborts; `cargo test` runs in the default profile and keeps unwinding.
panic = "abort"
