[package]
name = "mothzip"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
thiserror = "1.0"
